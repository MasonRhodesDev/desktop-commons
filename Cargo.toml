[workspace]
resolver = "2"
members = [
    "crates/xdg-paths",
    "crates/logind-session",
    "crates/hypr-ipc",
    "crates/slint-idle-runtime",
    "crates/singleton-guard",
    "crates/span-lines",
]

# Workspace builds use the local copy; git consumers of singleton-guard resolve
# xdg-paths from crates.io (patches do not propagate to dependents).
[patch.crates-io]
xdg-paths = { path = "crates/xdg-paths" }
