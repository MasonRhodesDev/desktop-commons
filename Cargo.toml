[workspace]
resolver = "2"
members = [
    "crates/xdg-paths",
    "crates/logind-session",
    "crates/hypr-ipc",
    "crates/slint-idle-runtime",
    "crates/singleton-guard",
    "crates/span-lines",
    "crates/vigil-log",
    "crates/panic-exit",
]

# Only crates that set `[lints] workspace = true` take these: vigil-log and
# panic-exit. scripts/rust_gates.py holds every such crate to the fence.
[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "forbid"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
mem_forget = "deny"
as_ptr_cast_mut = "deny"
cast_ptr_alignment = "deny"
ptr_as_ptr = "deny"
ptr_cast_constness = "deny"
borrow_as_ptr = "deny"
transmute_ptr_to_ptr = "deny"
transmute_undefined_repr = "deny"
transmutes_expressible_as_ptr_casts = "deny"
uninit_vec = "deny"
uninit_assumed_init = "deny"
mem_replace_with_uninit = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"

# Workspace builds use the local copy; git consumers of singleton-guard resolve
# xdg-paths from crates.io (patches do not propagate to dependents).
[patch.crates-io]
xdg-paths = { path = "crates/xdg-paths" }
