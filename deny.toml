# cargo-deny for the crates under the vigil-style gates (vigil-log and
# panic-exit). CI runs it per crate with --manifest-path; the rest of the
# workspace is not held to it yet.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Each ignore is { id = "RUSTSEC-...", reason = "expires YYYY-MM-DD: why" },
# no more than 183 days out. scripts/rust_gates.py advisories checks the form.
ignore = []

[licenses]
version = 2
allow = ["MIT", "Apache-2.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
# The whole resolved closure, not the direct dependencies. A new crate fails
# CI until a reviewer adds it here.
allow = [
    { crate = "libc", reason = "the syscalls vigil-log writes with and _exit" },
    { crate = "panic-exit", reason = "this repository" },
    { crate = "vigil-log", reason = "this repository" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
