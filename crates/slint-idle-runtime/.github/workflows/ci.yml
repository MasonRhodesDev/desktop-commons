name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: MasonRhodesDev/packaging-workflows/.github/workflows/rust-ci.yml@7638b87d1f43cc64aa6b8a4fbbca478bbb845fd3 # v1
    with:
      pacman-deps: fontconfig
