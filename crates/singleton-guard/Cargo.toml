[package]
name = "singleton-guard"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "flock-based single-instance guard kernel-released on any death"
repository = "https://github.com/MasonRhodesDev/desktop-commons"
publish = true

[dependencies]
# Registry dependency on purpose: consumers pull singleton-guard by git, and a
# path dependency would vendor a second xdg-paths source next to crates.io.
xdg-paths = "0.2.0"
libc = "0.2"
