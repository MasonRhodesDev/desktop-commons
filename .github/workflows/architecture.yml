name: Architecture

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test conformance runner
        run: python3 -m unittest discover -s tests -v
      - name: Validate registries and generated documents
        run: python3 scripts/architecture.py check
      - name: Scan cross-repository conformance
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/conformance.py
          --source github
          --format github
          --summary "$GITHUB_STEP_SUMMARY"
