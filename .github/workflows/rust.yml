name: Rust

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# vigil-log and panic-exit only: the crates that opt into the workspace lints.
# The other crates are not held to these gates yet.
env:
  GATED: -p vigil-log -p panic-exit

jobs:
  gated-crates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # the pin gate clones this checkout as a git source
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo fmt $GATED --check
      - name: Gate tests
        run: python3 -m unittest tests.test_rust_gates -v
      - name: Gates from the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        # the base branch's copy judges the pull request, so a pull request cannot weaken the check that judges it
        run: |
          base="origin/$BASE_REF"
          if ! git cat-file -e "$base:scripts/rust_gates.py" 2>/dev/null; then
            echo "::notice::$base has no scripts/rust_gates.py yet, so this pull request's own gates judge it"
            exit 0
          fi
          judge="$RUNNER_TEMP/base-gates"
          mkdir -p "$judge"
          git archive "$base" scripts/rust_gates.py | tar -x -C "$judge"
          python3 -I "$judge/scripts/rust_gates.py" --root "$GITHUB_WORKSPACE" fence advisories canary
      - name: Gates from this branch
        run: python3 -I scripts/rust_gates.py all
      - run: cargo clippy --locked $GATED --all-targets -- -D warnings
      - run: cargo test --locked $GATED

  cargo-deny:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: [vigil-log, panic-exit]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          manifest-path: crates/${{ matrix.crate }}/Cargo.toml
          arguments: --all-features --locked
