schema = 1

[[assertion]]
id = "secure-suspend-requires-lock"
kind = "file_contains"
repository = "hyprstate"
path = "src/daemon/dispatcher.rs"
pattern = "(?s)lock did not engage.*?return false;.*?fx\\.do_suspend"
barriers = ["BAR-016", "BAR-025"]
concerns = ["secure-lock-before-suspend"]
severity = "error"
message = "Suspend must not continue after lock readiness times out."

[[assertion]]
id = "game-sandbox-has-no-user-bypass"
kind = "file_not_contains"
repository = "greetd-game-mode"
path = "greetd/scripts/game-mode-wrapper.sh"
pattern = "\\.game-mode-no-mask"
barriers = ["BAR-017", "BAR-021"]
concerns = ["game-session-sandbox"]
severity = "error"
message = "The protected games user must not be able to disable its own home mask."

[[assertion]]
id = "game-mode-device-access-is-narrow"
kind = "file_not_contains"
repository = "greetd-game-mode"
path = "dist/game-mode.service"
pattern = "(?m)^SupplementaryGroups=.*\\b(input|video)\\b"
barriers = ["BAR-021"]
concerns = ["privilege-minimization"]
severity = "error"
message = "Game mode must use device-scoped access instead of broad input/video groups."

[[assertion]]
id = "game-mode-restart-failure-disarms"
kind = "file_contains"
repository = "greetd-game-mode"
path = "src/game_mode_switch.rs"
pattern = "(?s)systemctl.*?restart.*?greetd\\.service.*?status\\(\\)\\?;\\s*if !status\\.success\\(\\).*?disarm\\(\\)"
barriers = ["BAR-016", "BAR-025"]
concerns = ["alternate-game-session"]
severity = "error"
message = "A failed greetd restart must disarm the one-shot game-mode flag."

[assertion.waiver]
reason = "Known P1: restart status is logged but not checked."
expires = "2026-10-01"

[[assertion]]
id = "desktop-lock-command-is-packaged"
kind = "conditional_contains"
repository = "hypr-de"
when_path = "dist/hypr/hypridle.conf"
when_pattern = "\\bvigil-lock\\b"
path = "deps.toml"
pattern = "(?m)^(fedora|arch)\\s*=.*\"vigil\\s*>="
barriers = ["BAR-013", "BAR-018"]
concerns = ["screen-lock", "service-activation-completeness"]
severity = "error"
message = "If hypr-DE invokes vigil-lock, Vigil must be a generated runtime dependency with a version floor."

[[assertion]]
id = "desktop-bluetooth-ui-is-packaged"
kind = "conditional_contains"
repository = "hypr-de"
when_path = "dist/waybar/config.jsonc"
when_pattern = "\\boverskride\\b"
path = "deps.toml"
pattern = "\"overskride\""
barriers = ["BAR-012", "BAR-018"]
concerns = ["bluetooth"]
severity = "error"
message = "A configured Overskride action requires Overskride in the desktop dependency manifest."

[[assertion]]
id = "desktop-bluetooth-daemon-is-enabled"
kind = "file_contains"
repository = "hypr-de"
path = "dist/libexec/hypr-de-sys-setup"
pattern = "systemctl enable bluetooth\\.service"
barriers = ["BAR-012", "BAR-018"]
concerns = ["bluetooth"]
severity = "error"
message = "The desktop must enable bluetooth.service on install so the waybar module and Overskride have a running adapter."

[[assertion]]
id = "desktop-setup-validates-units"
kind = "file_contains"
repository = "hypr-de"
path = "dist/bin/hypr-de-setup"
pattern = "preset_and_check"
barriers = ["BAR-018", "BAR-025"]
concerns = ["service-activation-completeness"]
severity = "error"
message = "hypr-de-setup must verify user units are enabled and fail if they are not."

[[assertion]]
id = "desktop-fedora-enables-extras-copr"
kind = "file_contains"
repository = "hypr-de"
path = "get-hypr-de.sh"
pattern = "solaris765/hypr-de-extras"
barriers = ["BAR-009", "BAR-018"]
concerns = ["fedora-package-closure"]
severity = "error"
message = "get-hypr-de.sh must enable solaris765/hypr-de-extras so Fedora can install third-party deps Fedora and other COPRs do not ship."

[[assertion]]
id = "desktop-fedora-enables-current-hyprland-copr"
kind = "file_contains"
repository = "hypr-de"
path = "get-hypr-de.sh"
pattern = "nett00n/hyprland"
barriers = ["BAR-009", "BAR-018"]
concerns = ["fedora-package-closure"]
severity = "error"
message = "get-hypr-de.sh must enable a current Hyprland COPR (nett00n/hyprland); solopasha is abandoned below the 0.55 Lua floor."

[[assertion]]
id = "desktop-fedora-drops-abandoned-hyprland-copr"
kind = "file_not_contains"
repository = "hypr-de"
path = "get-hypr-de.sh"
pattern = "solopasha/hyprland"
barriers = ["BAR-009", "BAR-018"]
concerns = ["fedora-package-closure"]
severity = "error"
message = "get-hypr-de.sh must not enable the abandoned solopasha/hyprland COPR."

[[assertion]]
id = "desktop-composes-persistent-tray-watcher"
kind = "file_contains"
repository = "hypr-de"
path = "deps.toml"
pattern = "\"sni-watcher\""
barriers = ["BAR-010", "BAR-018"]
concerns = ["tray-registry", "service-activation-completeness"]
severity = "error"
message = "The desktop must install the watcher required by its persistent tray architecture."

[assertion.waiver]
reason = "Known P1: sni-watcher exists but is not a hypr-DE dependency or preset."
expires = "2026-10-01"

[[assertion]]
id = "legacy-greetd-owner-is-retired"
kind = "repository_archived"
repository = "greetd-config"
expected = true
barriers = ["BAR-001", "BAR-013"]
concerns = ["greetd-config-ownership"]
severity = "error"
message = "The predecessor that mutates /etc/greetd must be archived after ownership moved to greetd-game-mode."

[[assertion]]
id = "dotfiles-do-not-activate-legacy-greetd-owner"
kind = "file_not_contains"
repository = "dotfiles"
path = "dot_gitconfig.tmpl"
pattern = "/opt/greetd-config"
barriers = ["BAR-001", "BAR-013"]
concerns = ["greetd-config-ownership"]
severity = "error"
message = "Dotfiles must not configure the archived greetd-config checkout as an active system path."

[[assertion]]
id = "vigil-preserves-lock-pam-policy"
kind = "file_contains"
repository = "vigil"
path = "packaging/PKGBUILD"
pattern = "(?m)^backup=.*etc/pam\\.d/vigil-lock"
barriers = ["BAR-019"]
concerns = ["operator-policy-preservation"]
severity = "error"
message = "Arch packaging must preserve the documented operator-edited Vigil lock PAM policy."

[[assertion]]
id = "telemetry-has-version-envelope"
kind = "file_contains"
repository = "hyprstate"
path = "src/daemon/telemetry.rs"
pattern = "(?m)^\\s*pub version:\\s*"
barriers = ["BAR-007", "BAR-025"]
concerns = ["runtime-path-resolution"]
severity = "error"
message = "Cross-process telemetry must carry an explicit envelope version."

[[assertion]]
id = "packaging-workflow-references-are-immutable"
kind = "workflow_references_pinned"
repositories = ["desktop-commons", "dotfiles", "hyprstate", "dials", "hypr-de", "hypr-de-extras", "linux-multi-theme-toggle", "logind-idle-control", "sni-watcher", "waybar-workspace-buttons", "wayland-voice-dictation", "vigil", "greetd-game-mode", "couchcord", "deck-tenant", "packaging-workflows", "arch-repo", "xdg-paths", "logind-session", "hypr-ipc", "slint-idle-runtime"]
barriers = ["BAR-022", "BAR-023"]
concerns = ["dependency-pinning", "release-gating"]
severity = "error"
message = "Actions and reusable workflows must use immutable commit SHAs."

[[assertion]]
id = "slint-idle-runtime-pins-slint"
kind = "file_contains"
repository = "desktop-commons"
path = "crates/slint-idle-runtime/Cargo.toml"
pattern = "slint = \\{ version = \"=1\\.17\\.1\""
barriers = ["BAR-005", "BAR-007", "BAR-025"]
concerns = ["slint-idle-runtime"]
severity = "error"
message = "The shared runtime and its consumers must inhabit one exact Slint type universe."

[[assertion]]
id = "hyprstate-rpm-rewrites-git-sources"
kind = "file_contains"
repository = "hyprstate"
path = "packaging/hyprstate.spec"
pattern = '(?s)git\+https://github\.com/MasonRhodesDev/monitor-profiles\?rev=aef5f0e.*?replace-with = "vendored-sources"'
barriers = ["BAR-022", "BAR-023"]
concerns = ["fedora-package-closure"]
severity = "error"
message = "Offline RPM builds must rewrite the monitor-profiles git source onto vendored crates."

[[assertion]]
id = "packaging-containers-are-digest-pinned"
kind = "file_contains"
repository = "packaging-workflows"
path = ".github/workflows/rpm-check.yml"
pattern = "fedora:latest@sha256:[0-9a-f]{64}"
barriers = ["BAR-022"]
concerns = ["dependency-pinning"]
severity = "error"
message = "Reusable workflow containers must be pinned to registry digests."

[[assertion]]
id = "arch-packages-pin-source-checksums"
kind = "file_not_contains"
repositories = ["hyprstate", "dials", "hypr-de", "hypr-de-extras", "linux-multi-theme-toggle", "logind-idle-control", "sni-watcher", "waybar-workspace-buttons", "wayland-voice-dictation", "vigil", "greetd-game-mode", "couchcord", "deck-tenant"]
path = "packaging/PKGBUILD"
pattern = "sha256sums=\\(['\"]SKIP['\"]\\)"
barriers = ["BAR-022", "BAR-023"]
concerns = ["package-integrity"]
severity = "error"
message = "Released source archives must have pinned checksums."

[[assertion]]
id = "pacman-repository-does-not-disable-verification"
kind = "file_not_contains"
repository = "arch-repo"
path = "README.md"
pattern = "SigLevel\\s*=\\s*Optional\\s+TrustAll"
barriers = ["BAR-022"]
concerns = ["package-integrity"]
severity = "error"
message = "The package repository must not instruct clients to trust unsigned packages."

[[assertion]]
id = "pacman-repository-has-expected-manifest"
kind = "path_exists"
repository = "arch-repo"
path = "packages.toml"
barriers = ["BAR-024"]
concerns = ["package-registry-completeness"]
severity = "error"
message = "Repository publication needs an expected package/version manifest."

[[assertion]]
id = "pacman-repository-signs-packages-and-database"
kind = "file_contains"
repository = "arch-repo"
path = ".github/workflows/publish.yml"
pattern = "(?s)--detach-sign.*repo-add\\s+--include-sigs\\s+--sign"
barriers = ["BAR-022"]
concerns = ["package-integrity"]
severity = "error"
message = "Repository publication must sign package artifacts and the pacman database."

[[assertion]]
id = "release-publication-waits-for-required-gates"
kind = "file_contains"
repository = "packaging-workflows"
path = ".github/workflows/release.yml"
pattern = "needs:\\s*\\[arch-package,\\s*rpm-check,\\s*security\\]"
barriers = ["BAR-023"]
concerns = ["release-gating"]
severity = "error"
message = "Release assets must publish only after required package and security gates."

[[assertion]]
id = "release-requires-copr-publish"
kind = "file_contains"
repository = "packaging-workflows"
path = ".github/workflows/release.yml"
pattern = "a release must publish COPR"
barriers = ["BAR-009", "BAR-023"]
concerns = ["release-gating", "fedora-package-closure"]
severity = "error"
message = "rpm-enabled tag releases must fail when COPR publish secrets are missing."

[[assertion]]
id = "release-requires-arch-repo-dispatch"
kind = "file_contains"
repository = "packaging-workflows"
path = ".github/workflows/release.yml"
pattern = "a release must republish \\[mason\\]"
barriers = ["BAR-009", "BAR-023"]
concerns = ["release-gating"]
severity = "error"
message = "Tag releases must fail when ARCH_REPO_TOKEN is missing rather than waiting on cron."

[[assertion]]
id = "extras-release-is-ci-owned"
kind = "path_exists"
repository = "hypr-de-extras"
path = ".github/workflows/release.yml"
barriers = ["BAR-009", "BAR-023"]
concerns = ["fedora-package-closure"]
severity = "error"
message = "hypr-de-extras must publish overskride from a tag workflow, not a local copr-cli script."

[[assertion]]
id = "extras-has-no-laptop-copr-setup"
kind = "path_absent"
repository = "hypr-de-extras"
path = "scripts/setup-copr.sh"
barriers = ["BAR-009"]
concerns = ["fedora-package-closure"]
severity = "error"
message = "COPR project creation belongs in CI, not a developer-machine setup script."

[[assertion]]
id = "dotfiles-do-not-shadow-packaged-game-focus"
kind = "path_absent"
repository = "dotfiles"
path = "dot_config/systemd/user/bp-game-focus.service.tmpl"
barriers = ["BAR-001", "BAR-009", "BAR-013"]
concerns = ["package-user-overlay-shadowing"]
severity = "error"
message = "Personal units must not shadow the package-owned hypr-DE gaming service."

[assertion.waiver]
reason = "Known P1 migration residue in dotfiles."
expires = "2026-10-01"

[[assertion]]
id = "dotfiles-do-not-shadow-packaged-steam-cleanup"
kind = "path_absent"
repository = "dotfiles"
path = "dot_config/systemd/user/steam-clean-shutdown.service"
barriers = ["BAR-001", "BAR-009", "BAR-013"]
concerns = ["package-user-overlay-shadowing"]
severity = "error"
message = "Personal units must not shadow package-owned Steam cleanup."

[assertion.waiver]
reason = "Known P1 migration residue in dotfiles."
expires = "2026-10-01"

[[assertion]]
id = "dotfiles-secret-import-helper-exists"
kind = "path_exists"
repository = "dotfiles"
path = "dot_local/bin/executable_list-session-env"
barriers = ["BAR-018", "BAR-025"]
concerns = ["secrets-keyring"]
severity = "error"
message = "The enabled API-key importer must not depend on a missing session-environment helper."

[[assertion]]
id = "desktop-lock-does-not-use-pidof"
kind = "file_not_contains"
repository = "hypr-de"
path = "dist/hypr/hypridle.conf"
pattern = "pidof vigil-lock"
barriers = ["BAR-020"]
concerns = ["screen-lock"]
severity = "error"
message = "Lock discovery must not use machine-wide process-name matching."

[[assertion]]
id = "gui-does-not-own-telemetry-socket"
kind = "file_not_contains"
repository = "dials"
path = "src/telemetry.rs"
pattern = "UnixListener"
barriers = ["BAR-002", "BAR-010"]
concerns = ["display-settings"]
severity = "error"
message = "The GUI must connect to hyprstate telemetry as a client and must not bind the socket."

[[assertion]]
id = "idle-control-cli-requires-daemon-ack"
kind = "file_not_contains"
repository = "logind-idle-control"
path = "src/main.rs"
pattern = "(?s)emit_signal\\(\"(?:Enable|Disable|Toggle)\"\\)\\.await\\?;\\s*println!"
barriers = ["BAR-025"]
concerns = ["manual-idle-inhibition"]
severity = "error"
message = "The CLI must not report success from a destination-less emit_signal with no daemon acknowledgement."

[[assertion]]
id = "lmtt-qt6ct-writes-owned-palette"
kind = "file_contains"
repository = "linux-multi-theme-toggle"
path = "lmtt-modules/src/qt.rs"
pattern = "colors/lmtt\\.conf"
barriers = ["BAR-005", "BAR-012"]
concerns = ["theme-application"]
severity = "error"
message = "LMTT must write an owned qt6ct color scheme file rather than only exporting QT_QPA_PLATFORMTHEME."

[[assertion]]
id = "desktop-help-window-exists"
kind = "path_exists"
repository = "hypr-de"
path = "dist/bin/hypr-de-help"
barriers = ["BAR-005", "BAR-012"]
concerns = ["keybindings"]
severity = "error"
message = "hypr-DE must ship the welcome/help window."

[[assertion]]
id = "desktop-help-bind"
kind = "file_contains"
repository = "hypr-de"
path = "dist/hypr/main.lua"
pattern = "hypr-de-help"
barriers = ["BAR-005", "BAR-012"]
concerns = ["keybindings"]
severity = "error"
message = "SUPER+/ must open hypr-de-help."

[[assertion]]
id = "workspace-zones-manpage"
kind = "path_exists"
repository = "waybar-workspace-buttons"
path = "man/workspace-zones.7"
barriers = ["BAR-005", "BAR-012"]
concerns = ["workspace-navigation"]
severity = "error"
message = "workspace-zones must ship a man page."

[[assertion]]
id = "lock-request-never-fails-open"
kind = "file_contains"
repository = "hypr-de"
path = "dist/libexec/lock-cmd.sh"
pattern = "(?s)fail_closed\\(\\).*?terminate-session"
barriers = ["BAR-016"]
concerns = ["screen-lock"]
severity = "error"
message = "A lock request that no locker satisfies must take the session down, not return an unlocked desktop."

[[assertion]]
id = "lock-failsafe-not-session-tunable"
kind = "file_not_contains"
repository = "hypr-de"
path = "dist/libexec/lock-cmd.sh"
pattern = "HYPR_DE_LOCK_(FAILSAFE|FALLBACKS)"
barriers = ["BAR-017"]
concerns = ["screen-lock", "privilege-minimization"]
severity = "error"
message = "The lock failsafe must come from the root-owned policy file, not from an environment value the session can set."

[[assertion]]
id = "blanking-requires-the-compositor-lock"
kind = "file_contains"
repository = "hypr-de"
path = "dist/libexec/dpms-off-if-locked.sh"
pattern = "(?s)hyprctl locked.*?exit 0.*?dpms"
barriers = ["BAR-016", "BAR-025"]
concerns = ["screen-lock", "idle-timeouts"]
severity = "error"
message = "A DPMS-off must re-check the compositor lock itself, so blanking can never land on an unlocked desktop."

[[assertion]]
id = "hyprstate-never-blanks"
kind = "file_not_contains"
repository = "hyprstate"
path = "crates/hyprstate-fsm/src/profiles.rs"
pattern = 'action = "off"'
barriers = ["BAR-001", "BAR-025"]
concerns = ["idle-timeouts"]
severity = "error"
message = "hyprstate is an ON-only DPMS producer; a constructible DPMS-off argv makes it a second blanker."

[[assertion]]
id = "one-blanker-in-the-session"
kind = "path_absent"
repository = "hypr-de"
path = "dist/libexec/dpms-off-if-unlocked.sh"
barriers = ["BAR-001", "BAR-025"]
concerns = ["screen-lock", "idle-timeouts"]
severity = "error"
message = "One blanking authority, gated on the lock. A second listener that blanks while unlocked reintroduces the dark-but-unlocked screen."

[[assertion]]
id = "idle-driver-is-not-path-resolved"
kind = "file_not_contains"
repository = "hypr-de"
path = "dist/systemd/user/hypridle.service.d/hypr-de.conf"
pattern = "(?m)^Exec[A-Za-z]*=.*(command -v|which )"
barriers = ["BAR-017"]
concerns = ["package-user-overlay-shadowing", "idle-timeouts"]
severity = "error"
message = "hypridle must be named absolutely; the user manager's PATH includes ~/.local/bin, so a PATH lookup lets the session neuter auto-lock."

[[assertion]]
id = "installer-refuses-bad-signatures"
kind = "file_contains"
repository = "hypr-de"
path = "get-hypr-de.sh"
pattern = "UNTRUSTED_RE"
barriers = ["BAR-022"]
concerns = ["package-integrity"]
severity = "error"
message = "Signature failures must fail immediately and loudly, never be retried as transient repo metadata."

[[assertion]]
id = "copr-keys-are-pinned"
kind = "file_contains"
repository = "hypr-de"
path = "get-hypr-de.sh"
pattern = "(?s)COPR_KEYS=\\(.*?copr_pin_key"
barriers = ["BAR-022"]
concerns = ["package-integrity", "dependency-pinning"]
severity = "error"
message = "Every COPR the installer enables must be pinned to a fingerprint before it is granted root package trust."

[[assertion]]
id = "greetd-pam-rewrite-is-recoverable"
kind = "file_contains"
repository = "hypr-de"
path = "dist/libexec/hypr-de-sys-setup"
pattern = "(?s)hypr-de-backup.*?cat \"\\$tmp\" > \"\\$pam\""
barriers = ["BAR-019"]
concerns = ["operator-policy-preservation", "authentication"]
severity = "error"
message = "The greetd PAM stack must be backed up and the rewrite validated before it replaces the live file."

[[assertion]]
id = "recorder-state-is-not-world-writable"
kind = "file_not_contains"
repository = "hypr-de"
path = "dist/libexec/screen-recorder/modules/base.sh"
pattern = "(STATE_FILE|PIDFILE)=\"/tmp"
barriers = ["BAR-010"]
concerns = ["screen-recording", "runtime-path-resolution"]
severity = "error"
message = "Recorder state belongs in the per-user runtime dir; a predictable /tmp path is a symlink and pid-poisoning primitive."

[[assertion]]
id = "screenshare-consent-is-client-scoped"
kind = "file_contains"
repository = "hypr-de"
path = "dist/libexec/share-picker-cached"
pattern = "(?s)portal_clients\\(\\).*?no_new_client"
barriers = ["BAR-017"]
concerns = ["screen-sharing", "desktop-portals"]
severity = "error"
message = "Screen-share consent may only be replayed to the client that gave it, never to whoever asks next within the TTL."

[[assertion]]
id = "steam-launch-options-are-allowlisted"
kind = "file_contains"
repository = "hypr-de"
path = "dist/gaming/steam-set-launch-options"
pattern = "(?s)validate_launch_options\\(\\).*?refused token"
barriers = ["BAR-011"]
concerns = ["alternate-game-session"]
severity = "error"
message = "Model-proposed launch options are untrusted input and must pass a token allowlist before Steam can execute them."

[[assertion]]
id = "secure-suspend-single-call-site"
kind = "file_not_contains"
repository = "hyprstate"
path = "src/daemon/dispatcher.rs"
pattern = "(?s)fx\\.do_suspend\\(\\).*fx\\.do_suspend\\(\\)"
barriers = ["BAR-016", "BAR-025"]
concerns = ["secure-lock-before-suspend"]
severity = "error"
message = "Exactly one do_suspend call site: every suspend must traverse suspending_tail's lock proof."

[[assertion]]
id = "secure-suspend-no-effector-internal-caller"
kind = "file_not_contains"
repository = "hyprstate"
path = "src/daemon/effectors.rs"
pattern = "self\\.do_suspend"
barriers = ["BAR-016", "BAR-025"]
concerns = ["secure-lock-before-suspend"]
severity = "error"
message = "Effectors must not invoke do_suspend on themselves; only the dispatcher's suspending_tail calls it."

[[assertion]]
id = "idle-suspend-request-cleared-on-resume"
kind = "file_contains"
repository = "hyprstate"
path = "src/daemon/dispatcher.rs"
pattern = "(?s)Event::Resumed\\s*=>[^}]*clear_suspend_request"
barriers = ["BAR-016", "BAR-025"]
concerns = ["secure-lock-before-suspend"]
severity = "error"
message = "Resumed must consume the suspend request before the FSM re-derives, or resume re-enters Countdown."

[[assertion]]
id = "idle-listener-requests-never-suspends"
kind = "file_not_contains"
repository = "hypr-de"
path = "dist/hypr/hypridle.conf"
pattern = "(systemctl|loginctl) suspend"
barriers = ["BAR-016", "BAR-025"]
concerns = ["secure-lock-before-suspend"]
severity = "error"
message = "hypridle may only request suspend via hyprstate (idle-suspend.sh); a direct systemctl/loginctl suspend is a second writer."

[[assertion]]
id = "ladder-suspend-listener-ignores-claims"
kind = "file_contains"
repository = "hypr-de"
path = "dist/hypr/hypridle.conf"
pattern = "(?s)ignore_inhibit=true\\s*\\n\\s*condition_cmd=@LIBEXECDIR@/session-locked\\.sh\\s*\\n\\s*condition_retry=\\d+\\s*\\n\\s*on-timeout=@LIBEXECDIR@/idle-suspend\\.sh"
barriers = ["BAR-016", "BAR-025"]
concerns = ["secure-lock-before-suspend"]
severity = "error"
