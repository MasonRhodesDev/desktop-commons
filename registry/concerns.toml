status = "hybrid"
owner = "hypr-de"
internal = ["hypr-de", "hyprland-voice-dictation"]
external = ["PipeWire", "WirePlumber", "pipewire-pulse", "pipewire-alsa", "pavucontrol", "hyprpwcenter"]
risk = "high"
notes = "hypr-DE owns volume keys (wpctl), OSD, waybar pulse module, pavucontrol (app mixer), and hyprpwcenter (patchbay). PipeWire+WirePlumber own routing. Pulse and ALSA apps reach PipeWire via pipewire-pulse and pipewire-alsa. MPRIS transport is playerctl, not this concern."
