external = ["Hyprland"]
risk = "high"
notes = "Owner crate is hypr-ipc (HIS then lockfile rescan, socket2 listen, hyprctl ok/json, lua dialect boolean). Adopted by hyprstate and voice-dictation. waybar remains C. hypr-DE Lua/socat stay out of the crate."
barriers = ["BAR-007", "BAR-008", "BAR-012", "BAR-014"]

[[concern]]
