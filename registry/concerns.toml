internal = ["packaging-workflows", "arch-repo"]
external = ["pacman", "GitHub Releases", "GitHub Actions"]
risk = "medium"
notes = "Release source archives have pinned checksums; arch-repo signs every package, its validated manifest, and the repository database with a dedicated fingerprint-pinned key. Provenance and SBOM publication remain optional enhancements."
barriers = ["BAR-022", "BAR-023"]

[[concern]]
id = "release-gating"
area = "operations"
status = "owned"
owner = "packaging-workflows"
internal = ["packaging-workflows", "hyprstate", "vigil", "linux-multi-theme-toggle"]
external = ["GitHub Actions", "COPR"]
risk = "medium"
notes = "Reusable tag workflows build Arch and RPM packages, run configured security policy, and publish release assets only after all required gates succeed. A release must publish COPR and [mason]; missing COPR_CONFIG/COPR_WEBHOOK_URL or ARCH_REPO_TOKEN fails the job. COPR projects are created from CI, not from a laptop."
barriers = ["BAR-022", "BAR-023"]

