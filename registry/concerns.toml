external = ["systemd-logind"]
risk = "high"
notes = "Owner crate is hypr-logind (Inhibit RAII, GetSessionByPID then XDG_SESSION_ID then scored ListSessions, never the manager path). Adopted by logind-idle-control, voice-dictation, and hyprstate session/inhibit. Lid/suspend/LockedHint policy stays in the hyprstate daemon on the shared proxies."
barriers = ["BAR-007", "BAR-008", "BAR-020", "BAR-025"]

[[concern]]
