version = "1"
maturity = "stable"
compatibility = "Theme application merges tagged values and preserves user-owned configuration."
failure = "Previous LMTT configuration is backed up and reset remains available."
barriers = ["BAR-005", "BAR-007", "BAR-009"]

[[surface]]
id = "logind-inhibitor-identity-v1"
