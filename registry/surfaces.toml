maturity = "provisional"
compatibility = "Compile-time failures catch source drift, but there are no tagged releases or API snapshot tests."
failure = "Runtime fallback palettes duplicate LMTT values and can drift independently."
barriers = ["BAR-005", "BAR-007", "BAR-008"]

[[surface]]
id = "agent-pet-event-v1"
owner = "agent-pet"
producers = ["agent-pet", "external:agent-harnesses"]
consumers = ["agent-pet"]
transport = "D-Bus Emit carrying JSON event envelopes"
