producers = ["external:greetd"]
consumers = ["vigil", "greetd-game-mode", "greetd-config"]
transport = "greetd IPC and PAM"
location = "/run/greetd.sock and /etc/greetd"
version = "greetd protocol"
maturity = "external"
compatibility = "Greeters implement the greetd request/response protocol; session entries follow XDG conventions."
failure = "Authentication and alternate-session entry fail closed at the greeter."
barriers = ["BAR-004", "BAR-007", "BAR-011", "BAR-012"]

[[surface]]
id = "game-mode-armed-v1"
owner = "greetd-game-mode"
producers = ["greetd-game-mode"]
