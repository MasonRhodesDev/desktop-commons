schema = 1

[[surface]]
id = "xdg-paths-v0"
owner = "xdg-paths"
producers = ["xdg-paths"]
consumers = ["hyprstate", "dials", "logind-idle-control", "vigil", "linux-multi-theme-toggle", "wayland-voice-dictation"]
transport = "Rust library API"
location = "xdg_paths::ConfigDirs and xdg_paths::BaseDirs"
version = "0.1"
maturity = "provisional"
compatibility = "Config and data use absolute XDG_* or HOME fallback. Runtime must be set and absolute. No /run/user/<uid>, /tmp, or ~ expansion."
failure = "Callers receive Error and must not invent fallback paths."
barriers = ["BAR-005", "BAR-010", "BAR-020", "BAR-025"]

[[surface]]
id = "logind-session-v0"
owner = "logind-session"
producers = ["logind-session"]
consumers = ["logind-idle-control", "wayland-voice-dictation", "hyprstate"]
transport = "Rust library API"
location = "logind_session::resolve_session, logind_session::Inhibitor, login1 proxies"
version = "0.1"
maturity = "provisional"
compatibility = "GetSessionByPID returns an object path only. XDG_SESSION_ID is a fallback id, not a path. The manager object is never a session path."
failure = "Callers receive Error and must not invent a session path or hold a synthesized inhibitor."
barriers = ["BAR-007", "BAR-008", "BAR-020", "BAR-025"]

[[surface]]
id = "hypr-ipc-v0"
owner = "hypr-ipc"
producers = ["hypr-ipc"]
consumers = ["hyprstate", "wayland-voice-dictation"]
transport = "Rust library API"
location = "hypr_ipc::socket2_path, hypr_ipc::connect_socket2, hypr_ipc::hyprctl_ok"
version = "0.1"
maturity = "provisional"
compatibility = "HIS if .socket2.sock exists, else lockfile rescan with /proc/<pid>/comm == Hyprland. No /run/user/<uid> fallback. Mutating hyprctl success is stdout exactly ok."
failure = "Callers receive Error and must reconnect by re-resolving the instance."
barriers = ["BAR-007", "BAR-008", "BAR-012", "BAR-014"]

[[surface]]
id = "monitor-profile-v0"
owner = "monitor-profiles"
producers = ["monitor-profiles", "hyprstate", "dials"]
consumers = ["hyprstate", "dials", "vigil"]
transport = "TOML files"
location = "/etc/monitor-profiles/*.toml and ~/.config/hypr/profiles/*.toml"
version = "unversioned"
maturity = "provisional"
compatibility = "Unknown fields are rejected; malformed profiles are skipped; user profiles override same-named system profiles. Add an explicit version and golden cross-consumer fixtures before extending the schema."
failure = "Consumer emits diagnostics and retains or derives a safe display layout."
barriers = ["BAR-003", "BAR-004", "BAR-007"]

[[surface]]
id = "slint-idle-runtime-v0"
owner = "slint-idle-runtime"
producers = ["slint-idle-runtime"]
consumers = ["vigil", "wayland-voice-dictation"]
transport = "Rust library API"
location = "slint_idle_runtime::{WakeHandle, DirtySet, IdleScheduler, Metrics}"
version = "0.1"
maturity = "provisional"
compatibility = "All consumers use exactly Slint 1.17.1. A visible animation selects frame cadence, a real timer selects its deadline, and otherwise the UI loop blocks indefinitely."
failure = "Presenters remain application-owned. They must acquire buffers only for outputs returned by DirtySet::take_all and expose idle counters during soak testing."
barriers = ["BAR-005", "BAR-007", "BAR-008", "BAR-025"]

[[surface]]
id = "appearance-profile-v1"
owner = "appearance-profiles"
producers = ["appearance-profiles", "linux-multi-theme-toggle"]
consumers = ["linux-multi-theme-toggle", "vigil"]
transport = "TOML plus copied assets"
location = "/usr/share, /etc, XDG config, and /var/lib/appearance-profiles"
version = "1"
maturity = "provisional"
compatibility = "Fields resolve independently through packaged, system, user, and runtime layers."
failure = "Unreadable layers are skipped with diagnostics; application fallback remains available."
barriers = ["BAR-003", "BAR-004", "BAR-007"]

[[surface]]
id = "hyprstate-help-telemetry-v0"
owner = "hyprstate"
producers = ["hyprstate"]
consumers = ["dials"]
transport = "newline-delimited JSON over Unix stream socket"
location = "$XDG_RUNTIME_DIR/hyprstate-telemetry.sock"
version = "0"
maturity = "provisional"
compatibility = "NDJSON frames carry an explicit version field. The GUI is a client of $XDG_RUNTIME_DIR/hyprstate-telemetry.sock and must not bind it."
failure = "Producer silently drops frames without a listener; GUI skips malformed frames."
barriers = ["BAR-002", "BAR-007", "BAR-010", "BAR-025"]

[[surface]]
id = "hyprstate-power1"
owner = "hyprstate"
producers = ["hyprstate"]
consumers = ["hyprstate", "dials"]
transport = "system D-Bus"
location = "org.hyprstate.Power1"
version = "1"
maturity = "stable"
compatibility = "Interface version is encoded in the D-Bus name."
failure = "Requests fail closed; policy remains visible while privileged changes are unapplied."
barriers = ["BAR-001", "BAR-002", "BAR-007", "BAR-011"]

[[surface]]
id = "lmtt-tokens-v1"
owner = "linux-multi-theme-toggle"
producers = ["linux-multi-theme-toggle"]
consumers = ["slint-kit", "dials", "vigil", "waybar-workspace-buttons"]
transport = "lmtt-core library API and `lmtt tokens` CLI"
location = "lmtt_core::tokens and `lmtt tokens`"
version = "1"
maturity = "provisional"
compatibility = "Suite apps load tokens through lmtt-core or `lmtt tokens`. They must not open theme files. GTK/Waybar CSS under matugen remains LMTT fan-out into foreign apps, not a suite contract."
failure = "Missing user tokens fall through to /etc/lmtt, /usr/share/lmtt, then the embedded palette."
barriers = ["BAR-005", "BAR-007", "BAR-010", "BAR-025"]

[[surface]]
id = "lmtt-portal-appearance-v1"
owner = "linux-multi-theme-toggle"
producers = ["linux-multi-theme-toggle"]
consumers = ["external:xdg-desktop-portal", "external:gtk", "external:electron"]
transport = "XDG desktop portal Settings (gsettings write, portal ReadOne / SettingChanged)"
location = "org.freedesktop.appearance color-scheme and optional accent-color"
version = "1"
maturity = "provisional"
compatibility = "LMTT writes host gsettings; the real portal emits SettingChanged. Do not emit a fake portal signal. Suite palette tokens are not carried here."
failure = "If the portal does not confirm color-scheme, foreign GTK/Electron apps may keep the previous scheme. Suite apps still load tokens.json."
barriers = ["BAR-005", "BAR-007", "BAR-010", "BAR-025"]

[[surface]]
id = "lmtt-slint-token-v0"
owner = "linux-multi-theme-toggle"
producers = ["linux-multi-theme-toggle"]
consumers = []
transport = "JSON file plus filesystem watch"
location = "~/.config/matugen/lmtt-slint.json"
version = "unversioned"
maturity = "legacy"
compatibility = "Superseded by lmtt-tokens-v1. Do not add consumers."
failure = "Ignored by suite apps; LMTT may migrate the file once into the user data token store."
barriers = ["BAR-005", "BAR-007", "BAR-010", "BAR-025"]

[[surface]]
id = "lmtt-color-css-v0"
owner = "linux-multi-theme-toggle"
producers = ["linux-multi-theme-toggle"]
consumers = []
transport = "CSS color definitions"
location = "~/.config/matugen/lmtt-colors.css"
version = "unversioned"
maturity = "legacy"
compatibility = "Superseded by lmtt-tokens-v1 for suite apps. Remaining writes are GTK/Waybar fan-out only."
failure = "Foreign apps that still @import this file see stale colors if LMTT does not write it."
barriers = ["BAR-005", "BAR-007", "BAR-010", "BAR-025"]

[[surface]]
id = "hypr-de-theme-v1"
owner = "hypr-de"
producers = ["hypr-de"]
consumers = ["linux-multi-theme-toggle"]
transport = "theme.toml, palette assets, and LMTT module fragments"
location = "/usr/share/hypr-de/themes and ~/.local/share/hypr-de/themes"
version = "1"
maturity = "stable"
compatibility = "Theme application merges tagged values and preserves user-owned configuration."
failure = "Previous LMTT configuration is backed up and reset remains available."
barriers = ["BAR-005", "BAR-007", "BAR-009"]

[[surface]]
id = "lmtt-qt6ct-v0"
owner = "linux-multi-theme-toggle"
producers = ["linux-multi-theme-toggle"]
consumers = ["external:qt6ct"]
transport = "qt6ct color scheme file plus merged INI Appearance"
location = "~/.config/qt6ct/colors/lmtt.conf and [Appearance] in ~/.config/qt6ct/qt6ct.conf"
version = "unversioned"
maturity = "provisional"
compatibility = "LMTT owns the colors file. Appearance keys color_scheme_path, custom_palette, style, and icon_theme are merged. Fonts and other sections stay user-owned. A non-qt6ct QT_QPA_PLATFORMTHEME skips the conf merge."
failure = "Qt widgets keep the previous qt6ct palette; GTK and portal appearance are unaffected."
barriers = ["BAR-005", "BAR-007", "BAR-012"]

[[surface]]
id = "hypr-de-help-v0"
owner = "hypr-de"
producers = ["hypr-de"]
consumers = ["hypr-de"]
transport = "GTK4/libadwaita window plus man pages"
location = "hypr-de-help, man hypr-de, man workspace-zones"
version = "unversioned"
maturity = "provisional"
compatibility = "SUPER+/ opens the window. Binds are loaded from hyprctl binds -j. First login is marker-gated via hypr-de-welcome."
failure = "Missing GTK falls back to notify-send. Missing hyprctl still shows How it works without binds."
barriers = ["BAR-005", "BAR-012"]

[[surface]]
id = "logind-inhibitor-identity-v1"
owner = "hyprstate"
producers = ["hyprstate", "logind-idle-control", "wayland-voice-dictation"]
consumers = ["hyprstate"]
transport = "systemd-logind inhibitor rows"
location = "org.freedesktop.login1.Manager.ListInhibitors"
version = "1"
maturity = "provisional"
compatibility = "The inhibitor who field is the canonical executable/service identity."
failure = "Unknown idle or sleep blockers are treated as real inhibitors; only registered baseline identities are ignored."
barriers = ["BAR-001", "BAR-005", "BAR-007", "BAR-012"]

[[surface]]
id = "idle-control-dbus-v1"
owner = "logind-idle-control"
producers = ["logind-idle-control"]
consumers = ["logind-idle-control", "hypr-de"]
transport = "session D-Bus plus runtime state file"
location = "com.logind.IdleControl at /com/logind/IdleControl/session_N"
version = "1"
maturity = "legacy"
compatibility = "Destination-less signals use a session-scoped path, but no service owns the documented com.logind.IdleControl name. Replace with an owned versioned methods/properties interface."
failure = "The CLI can report success when no daemon received its broadcast; initial state relies on a side-channel runtime file."
barriers = ["BAR-001", "BAR-007", "BAR-010", "BAR-014", "BAR-025"]

[[surface]]
id = "status-notifier-v1"
owner = "sni-watcher"
producers = ["sni-watcher"]
consumers = ["logind-idle-control", "wayland-voice-dictation", "agent-pet", "hypr-de"]
transport = "StatusNotifier D-Bus protocol"
location = "org.kde.StatusNotifierWatcher"
version = "freedesktop/KDE SNI"
maturity = "stable"
compatibility = "Applications register items; Waybar registers only as host when the watcher already exists."
failure = "Tray items wait for a watcher and remain functional through their non-tray interfaces."
barriers = ["BAR-005", "BAR-010", "BAR-014"]

[[surface]]
id = "hyprland-ipc-v1"
owner = "external:hyprland"
producers = ["external:hyprland"]
consumers = ["hyprstate", "dials", "waybar-workspace-buttons", "wayland-voice-dictation", "agent-pet", "hypr-de"]
transport = "Hyprland event socket and hyprctl JSON/dispatch"
location = "$XDG_RUNTIME_DIR/hypr/<instance>/.socket2.sock"
version = "Hyprland release API"
maturity = "external"
compatibility = "Consumers must rediscover compositor instances and isolate command-dialect changes."
failure = "Reconnect with rediscovery; retain safe state and expose degraded health."
barriers = ["BAR-005", "BAR-012", "BAR-014"]

[[surface]]
id = "voice-dictation-dbus-v1"
owner = "wayland-voice-dictation"
producers = ["wayland-voice-dictation"]
consumers = ["hypr-de"]
transport = "session D-Bus, CLI, and live Unix stream"
location = "com.voicedictation.Control and packaged voice-dictation executable"
version = "1"
maturity = "legacy"
compatibility = "The CLI wraps an unversioned com.voicedictation.Control interface. D-Bus Status should become authoritative before removing legacy side channels."
failure = "A global /tmp state file can become stale or collide across sessions; two unused socket protocols remain alongside D-Bus."
barriers = ["BAR-005", "BAR-007", "BAR-010", "BAR-014", "BAR-020", "BAR-025"]

[[surface]]
id = "schema-tui-schema-v1"
owner = "schema-tui"
producers = ["linux-multi-theme-toggle", "wayland-voice-dictation"]
consumers = ["schema-tui"]
transport = "JSON Schema and TOML"
location = "repository-owned config-schema.json"
version = "consumer schema says 1.0; library does not enforce it"
maturity = "provisional"
compatibility = "Schema version is parsed but not enforced; consumers use an unpinned Git dependency."
failure = "Validation is not invoked by the builder and saves can drop unknown TOML sections, keys, and comments."
barriers = ["BAR-002", "BAR-005", "BAR-007", "BAR-025"]

[[surface]]
id = "greetd-greeter-v1"
owner = "external:greetd"
producers = ["external:greetd"]
consumers = ["vigil", "greetd-game-mode", "greetd-config"]
transport = "greetd IPC and PAM"
location = "/run/greetd.sock and /etc/greetd"
version = "greetd protocol"
maturity = "external"
compatibility = "Greeters implement the greetd request/response protocol; session entries follow XDG conventions."
failure = "Authentication and alternate-session entry fail closed at the greeter."
barriers = ["BAR-004", "BAR-007", "BAR-011", "BAR-012"]

[[surface]]
id = "game-mode-armed-v1"
owner = "greetd-game-mode"
producers = ["greetd-game-mode"]
consumers = ["greetd-game-mode"]
transport = "one-shot runtime flag consumed by greetd dispatch"
location = "/run/game-mode/armed"
version = "1"
maturity = "provisional"
compatibility = "The armed flag is consumed once and expires after 60 seconds."
failure = "Restart failure currently leaves the flag fresh, allowing a later greetd restart to enter game mode unexpectedly."
barriers = ["BAR-004", "BAR-007", "BAR-011", "BAR-013", "BAR-016", "BAR-025"]

[[surface]]
id = "notification-replace-tag-v1"
owner = "hyprstate"
producers = ["hyprstate"]
consumers = ["external:notification-daemon", "hyprnotice"]
transport = "freedesktop notification hint"
location = "x-canonical-private-synchronous"
version = "1"
maturity = "stable"
compatibility = "Stable tags hyprstate-power and hyprstate-gpu replace earlier notifications in the same class."
failure = "Unsupported daemons display independent notifications."
barriers = ["BAR-005", "BAR-007", "BAR-012"]

[[surface]]
id = "declared-units-v1"
owner = "hypr-de"
producers = ["hypr-de"]
consumers = ["hypr-de"]
transport = "deps.toml `units` key per dependency section"
location = "hypr-DE/deps.toml, gated by packaging/check-units.sh"
version = "1"
maturity = "provisional"
compatibility = "A dependency that must contribute a user unit lists it under that section's units key. The gate requires every declared unit to be in 90-hypr-de.preset and validated by hypr-de-setup, so adding a service-bearing dependency forces declaring and enabling its unit."
failure = "Undeclared units are not covered; the gate cannot see a unit nobody names."
barriers = ["BAR-009", "BAR-018"]

[[surface]]
id = "release-package-v1"
owner = "packaging-workflows"
producers = ["hyprstate", "dials", "hypr-de", "hypr-de-extras", "linux-multi-theme-toggle", "logind-idle-control", "sni-watcher", "waybar-workspace-buttons", "wayland-voice-dictation", "vigil", "greetd-game-mode", "couchcord", "deck-tenant"]
consumers = ["arch-repo"]
transport = "Git tag, GitHub Release, Arch package, and source RPM"
location = "v* tags and *.pkg.tar.zst release assets"
version = "repository package version"
maturity = "stable"
compatibility = "Version consistency and source checksums are enforced; workflow dependencies are immutable and configured package/security gates complete before release assets publish. rpm-enabled tags must submit COPR and dispatch arch-repo; missing publish secrets fail the release."
failure = "A failed Arch, RPM, security, COPR, or arch-repo dispatch gate prevents treating the tag as published."
barriers = ["BAR-007", "BAR-009", "BAR-015", "BAR-022", "BAR-023"]

[[surface]]
id = "mason-pacman-repository-v1"
owner = "arch-repo"
producers = ["arch-repo"]
consumers = ["hypr-de", "dotfiles", "greetd-game-mode", "deck-tenant"]
transport = "pacman repository database over GitHub Pages"
location = "https://masonrhodesdev.github.io/arch-repo/x86_64"
version = "packages.toml schema 1 plus pacman repository metadata"
maturity = "stable"
compatibility = "Every declared latest release asset must match its embedded package name and tag version; packages, manifest, and database are signed by the committed repository fingerprint."
failure = "Missing, stale, unexpected, unsigned, or version-skewed assets fail the build before the previous atomic GitHub Pages deployment is replaced."
barriers = ["BAR-005", "BAR-007", "BAR-009", "BAR-012", "BAR-022", "BAR-024"]

[[surface]]
id = "sni-waybar-ordering-v1"
owner = "sni-watcher"
producers = ["sni-watcher"]
consumers = ["hypr-de"]
transport = "systemd user-unit ordering and D-Bus ownership"
location = "sni-watcher.service Before=waybar.service"
version = "1"
maturity = "stable"
compatibility = "sni-watcher owns the watcher name before Waybar starts as a host."
failure = "Waybar may create a temporary watcher; diagnostics must expose the wrong owner."
barriers = ["BAR-001", "BAR-007", "BAR-010", "BAR-014"]

[[surface]]
id = "hyprstate-control-v0"
owner = "hyprstate"
producers = ["dials"]
consumers = ["hyprstate"]
transport = "TOML/directive files, one-word state files, and subprocess CLI calls"
location = "~/.config/hypr/power.conf, power-override, monitor profiles, and /var/lib/hyprstate/profile"
version = "unversioned"
maturity = "provisional"
compatibility = "Files remain persistence formats, not a coherent control protocol. A versioned user-bus interface should own requests and status."
failure = "Path, CLI, and package skew presents as unavailable state or command failure while side-channel files may remain stale."
barriers = ["BAR-001", "BAR-002", "BAR-007", "BAR-010", "BAR-025"]

[[surface]]
id = "settings-entry-v1"
owner = "dials"
producers = ["dials", "linux-multi-theme-toggle"]
consumers = ["dials"]
transport = "XDG desktop entries"
location = "$XDG_DATA_HOME/applications and $XDG_DATA_DIRS/applications; Categories=Settings; or X-Dials-Section=<Appearance|Hardware|Network|System|Other>"
version = "1"
maturity = "provisional"
compatibility = "Categories=Settings; is the freedesktop convention and also lists the entry in LXQt and Xfce settings managers. X-Dials-Section only picks the group. NoDisplay, Hidden, OnlyShowIn/NotShowIn, and a missing TryExec hide an entry. Exec field codes are dropped."
failure = "A tool without a desktop entry is simply not listed; dials never embeds or imports another tool."
barriers = ["BAR-001", "BAR-012"]

[[surface]]
id = "slint-kit-api-0.2"
owner = "slint-kit"
producers = ["slint-kit"]
consumers = ["dials", "vigil"]
transport = "Rust API, Slint imports, semantic properties, and controls"
location = "slint-kit crate and ui/*.slint"
