barriers = ["BAR-005", "BAR-007", "BAR-009", "BAR-012", "BAR-023"]

[[surface]]
id = "greetd-static-config-v1"
owner = "greetd-game-mode"
producers = ["greetd-game-mode", "greetd-config"]
consumers = ["external:greetd"]
transport = "package/setup-managed greetd configuration"
location = "/etc/greetd/config.toml and related /etc/greetd payload"
version = "1 current path plus legacy alternative"
maturity = "legacy"
compatibility = "greetd-game-mode is the current owner; greetd-config remains a conflicting functional predecessor."
failure = "Running both setup paths rewrites or symlinks the same tree and can leave the login path incoherent."
barriers = ["BAR-001", "BAR-004", "BAR-013", "BAR-018", "BAR-019"]

[[surface]]
id = "vigil-lock-protocol-v1"
owner = "vigil"
producers = ["vigil"]
consumers = ["external:hyprland", "hyprstate", "hypr-de"]
transport = "ext-session-lock-v1, PAM, and logind LockedHint"
location = "vigil-lock and /etc/pam.d/vigil-lock"
version = "Wayland ext-session-lock-v1"
maturity = "provisional"
compatibility = "Vigil actively owns login and lock, but hypr-DE packaging still installs and references conflicting locker paths. hypr-DE's lock_cmd wrapper depends on vigil-lock exit codes: 0 means the session lock was granted, 3 means an idle lock was cancelled by user activity, and any other status is a launch or lock failure the wrapper escalates. Changing those codes changes whether sessions get terminated, so they are part of this contract."
failure = "A lock-client crash intentionally leaves the compositor locked; no packaged restart owner currently guarantees recovery. A locker that never starts is now handled: hypr-DE retries unscoped, tries other installed lockers, and terminates the session rather than returning an unlocked desktop."
barriers = ["BAR-001", "BAR-007", "BAR-016", "BAR-018", "BAR-019", "BAR-020"]

[[surface]]
id = "logind-locked-hint-v1"
owner = "vigil"
producers = ["vigil"]
consumers = ["hyprstate", "logind-idle-control"]
transport = "systemd-logind session LockedHint and lock/unlock signals"
location = "org.freedesktop.login1.Session"
version = "logind API"
maturity = "provisional"
compatibility = "LockedHint is the authoritative cross-component lock state; process-name detection is not compatible."
failure = "A missing or delayed hint must block secure suspend rather than time out into suspension."
barriers = ["BAR-005", "BAR-007", "BAR-016", "BAR-020", "BAR-025"]

[[surface]]
id = "secure-suspend-v0"
owner = "hyprstate"
producers = ["vigil", "hyprstate"]
consumers = ["external:systemd-logind"]
transport = "lock request, LockedHint readiness, then logind suspend"
location = "hyprstate lid FSM and org.freedesktop.login1"
version = "unversioned"
maturity = "provisional"
compatibility = "Locker readiness and suspend policy need one written positive-acknowledgement contract."
failure = "Lock readiness timeout aborts the suspend transition and re-arms lid grace; suspend proceeds only after positive lock confirmation."
barriers = ["BAR-001", "BAR-007", "BAR-016", "BAR-025"]

[[surface]]
id = "graphical-session-lifecycle-v0"
owner = "hypr-de"
producers = ["external:uwsm", "hypr-de"]
consumers = ["hyprstate", "sni-watcher", "logind-idle-control", "wayland-voice-dictation", "agent-pet"]
transport = "systemd user targets, wants, parts, and ordering"
location = "graphical-session.target and packaged user units"
version = "unversioned"
maturity = "provisional"
compatibility = "Services must bind startup and teardown to the graphical session and explicitly pull required audio, tray, and compositor dependencies."
failure = "Incomplete PartOf/Requisite/Wants relationships leave services running outside their usable session or absent when expected."
barriers = ["BAR-007", "BAR-009", "BAR-014", "BAR-018"]

[[surface]]
id = "precompositor-gpu-selection-v1"
owner = "hyprstate"
producers = ["hyprstate"]
