location = "/run/game-mode/armed"
version = "1"
maturity = "provisional"
compatibility = "The armed flag is consumed once and expires after 60 seconds."
failure = "Restart failure currently leaves the flag fresh, allowing a later greetd restart to enter game mode unexpectedly."
barriers = ["BAR-004", "BAR-007", "BAR-011", "BAR-013", "BAR-016", "BAR-025"]

[[surface]]
id = "notification-replace-tag-v1"
