failure = "A failed Arch, RPM, or configured security gate prevents release asset publication and downstream repository dispatch."
barriers = ["BAR-007", "BAR-009", "BAR-015", "BAR-022", "BAR-023"]

[[surface]]
id = "mason-pacman-repository-v1"
