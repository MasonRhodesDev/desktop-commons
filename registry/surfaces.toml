[[surface]]
id = "waybar-cffi-v2"
owner = "waybar-workspace-buttons"
producers = ["waybar-workspace-buttons"]
consumers = ["external:waybar", "external:hyprland"]
transport = "Waybar CFFI module and Hyprland plugin ABI"
location = "workspace_buttons.so and workspace-zones hyprpm plugin"
version = "wbcffi 2 plus exact Hyprland build hash"
