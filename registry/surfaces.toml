version = "1"
maturity = "provisional"
compatibility = "The inhibitor who field is the canonical executable/service identity."
failure = "Unknown idle or sleep blockers are treated as real inhibitors; only registered baseline identities are ignored."
barriers = ["BAR-001", "BAR-005", "BAR-007", "BAR-012"]

[[surface]]
id = "idle-control-dbus-v1"
