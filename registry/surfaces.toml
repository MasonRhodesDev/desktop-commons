schema = 1

[[surface]]
id = "hypr-paths-xdg-v0"
owner = "hypr-paths"
producers = ["hypr-paths"]
consumers = ["hyprstate", "hyprstate-gui", "logind-idle-control", "vigil"]
transport = "Rust library API"
location = "hypr_paths::ConfigDirs and hypr_paths::BaseDirs"
version = "0.1"
maturity = "provisional"
compatibility = "Config and data use absolute XDG_* or HOME fallback. Runtime must be set and absolute. No /run/user/<uid>, /tmp, or ~ expansion."
failure = "Callers receive Error and must not invent fallback paths."
barriers = ["BAR-005", "BAR-010", "BAR-020", "BAR-025"]

[[surface]]
id = "monitor-profile-v0"
owner = "monitor-profiles"
producers = ["monitor-profiles", "hyprstate", "hyprstate-gui"]
consumers = ["hyprstate", "hyprstate-gui", "vigil"]
transport = "TOML files"
location = "/etc/monitor-profiles/*.toml and ~/.config/hypr/profiles/*.toml"
version = "unversioned"
maturity = "provisional"
compatibility = "Unknown fields are rejected; malformed profiles are skipped; user profiles override same-named system profiles. Add an explicit version and golden cross-consumer fixtures before extending the schema."
failure = "Consumer emits diagnostics and retains or derives a safe display layout."
barriers = ["BAR-003", "BAR-004", "BAR-007"]

[[surface]]
id = "appearance-profile-v1"
owner = "appearance-profiles"
producers = ["appearance-profiles", "linux-multi-theme-toggle"]
consumers = ["linux-multi-theme-toggle", "vigil"]
transport = "TOML plus copied assets"
location = "/usr/share, /etc, XDG config, and /var/lib/appearance-profiles"
version = "1"
maturity = "provisional"
compatibility = "Fields resolve independently through packaged, system, user, and runtime layers."
failure = "Unreadable layers are skipped with diagnostics; application fallback remains available."
barriers = ["BAR-003", "BAR-004", "BAR-007"]

[[surface]]
id = "hyprstate-help-telemetry-v0"
owner = "hyprstate"
producers = ["hyprstate"]
consumers = ["hyprstate-gui"]
transport = "newline-delimited JSON over Unix stream socket"
location = "$XDG_RUNTIME_DIR/hyprstate-telemetry.sock"
version = "unversioned"
maturity = "provisional"
compatibility = "No envelope version exists. Producer and consumer need one XDG path resolver, additive-field fixtures, socket ownership, and initial-snapshot semantics."
failure = "Producer silently drops frames without a listener; GUI skips malformed frames. Current fallback paths disagree and a second GUI can unlink the first listener."
barriers = ["BAR-002", "BAR-007", "BAR-010", "BAR-025"]

[[surface]]
id = "hyprstate-power1"
