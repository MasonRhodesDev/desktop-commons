version = "Hyprland release API"
maturity = "external"
compatibility = "Consumers must rediscover compositor instances and isolate command-dialect changes."
failure = "Reconnect with rediscovery; retain safe state and expose degraded health."
barriers = ["BAR-005", "BAR-012", "BAR-014"]

[[surface]]
id = "voice-dictation-dbus-v1"
owner = "hyprland-voice-dictation"
producers = ["hyprland-voice-dictation"]
consumers = ["hypr-de"]
transport = "session D-Bus, CLI, and live Unix stream"
location = "com.voicedictation.Control and packaged voice-dictation executable"
version = "1"
maturity = "legacy"
compatibility = "The CLI wraps an unversioned com.voicedictation.Control interface. D-Bus Status should become authoritative before removing legacy side channels."
failure = "A global /tmp state file can become stale or collide across sessions; two unused socket protocols remain alongside D-Bus."
barriers = ["BAR-005", "BAR-007", "BAR-010", "BAR-014", "BAR-020", "BAR-025"]

[[surface]]
id = "schema-tui-schema-v1"
owner = "schema-tui"
producers = ["linux-multi-theme-toggle", "hyprland-voice-dictation"]
consumers = ["schema-tui"]
transport = "JSON Schema and TOML"
location = "repository-owned config-schema.json"
version = "consumer schema says 1.0; library does not enforce it"
maturity = "provisional"
compatibility = "Schema version is parsed but not enforced; consumers use an unpinned Git dependency."
failure = "Validation is not invoked by the builder and saves can drop unknown TOML sections, keys, and comments."
barriers = ["BAR-002", "BAR-005", "BAR-007", "BAR-025"]

[[surface]]
id = "greetd-greeter-v1"
