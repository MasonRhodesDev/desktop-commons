maturity = "legacy"
compatibility = "Destination-less signals use a session-scoped path, but no service owns the documented com.logind.IdleControl name. Replace with an owned versioned methods/properties interface."
failure = "The CLI can report success when no daemon received its broadcast; initial state relies on a side-channel runtime file."
barriers = ["BAR-001", "BAR-007", "BAR-010", "BAR-014", "BAR-025"]

[[surface]]
id = "status-notifier-v1"
owner = "sni-watcher"
producers = ["sni-watcher"]
consumers = ["logind-idle-control", "hyprland-voice-dictation", "agent-pet", "hypr-de"]
transport = "StatusNotifier D-Bus protocol"
location = "org.kde.StatusNotifierWatcher"
version = "freedesktop/KDE SNI"
maturity = "stable"
compatibility = "Applications register items; Waybar registers only as host when the watcher already exists."
failure = "Tray items wait for a watcher and remain functional through their non-tray interfaces."
barriers = ["BAR-005", "BAR-010", "BAR-014"]

[[surface]]
id = "hyprland-ipc-v1"
owner = "external:hyprland"
producers = ["external:hyprland"]
consumers = ["hyprstate", "hyprstate-gui", "waybar-workspace-buttons", "hyprland-voice-dictation", "agent-pet", "hypr-de"]
