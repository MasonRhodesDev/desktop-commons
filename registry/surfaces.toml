producers = ["hyprstate"]
consumers = ["hyprstate", "hyprstate-gui"]
transport = "system D-Bus"
location = "org.hyprstate.Power1"
version = "1"
maturity = "stable"
compatibility = "Interface version is encoded in the D-Bus name."
failure = "Requests fail closed; policy remains visible while privileged changes are unapplied."
barriers = ["BAR-001", "BAR-002", "BAR-007", "BAR-011"]

[[surface]]
id = "lmtt-slint-token-v0"
