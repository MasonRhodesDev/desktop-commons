producers = ["linux-multi-theme-toggle"]
consumers = ["slint-kit", "hyprstate-gui"]
transport = "JSON file plus filesystem watch"
location = "~/.config/matugen/lmtt-slint.json"
version = "unversioned"
maturity = "provisional"
compatibility = "The current mode/colors object is unversioned. Required tokens need validation and a golden palette fixture."
failure = "The producer write is not atomic; parse failure falls through to CSS and embedded tokens instead of retaining last-known-good state."
barriers = ["BAR-005", "BAR-007", "BAR-010", "BAR-025"]

[[surface]]
id = "lmtt-color-css-v0"
owner = "linux-multi-theme-toggle"
producers = ["linux-multi-theme-toggle"]
consumers = ["waybar-workspace-buttons", "hyprnotice", "hypr-de"]
transport = "CSS color definitions"
location = "~/.config/matugen/lmtt-colors.css"
version = "unversioned"
maturity = "provisional"
compatibility = "Consumers independently parse Mode comments and define-color tokens. A versioned JSON palette should become canonical while CSS remains generated compatibility output."
failure = "Consumers use inconsistent shell, CSS, or embedded fallbacks; hyprnotice's documented reload hook is absent from current LMTT."
barriers = ["BAR-005", "BAR-007", "BAR-010", "BAR-025"]

[[surface]]
id = "hypr-de-theme-v1"
